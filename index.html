<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Madrassah Application</title>
<style>
  body { font-family: Arial; background: #f4f4f9; padding: 20px; }
  .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px #ccc; }
  h1 { text-align: center; color: #2c3e50; }
  input, textarea, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 5px; }
  button { width: 100%; padding: 12px; background: #25D366; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
  button:hover { background: #1ebe5a; }
  #adminArea { display: none; margin-top: 20px; padding: 15px; background: #ecf0f1; border-radius: 5px; }
</style>
</head>
<body>

<div class="container">
  <h1>📖 Online Madrassah Application</h1>
  <h1>📖 Online Madrassah Application</h1>

<!-- ADD MENU HERE -->
<div style="text-align:center; margin-bottom:20px; padding:10px; background:#e8f5e9; border-radius:8px;">
  <a href="index.html" style="margin:0 8px; color:#2d6a4f; text-decoration:none; font-weight:bold;">Home</a> | 
  <a href="about.html" style="margin:0 8px; color:#2d6a4f; text-decoration:none; font-weight:bold;">About</a> | 
  <a href="classes.html" style="margin:0 8px; color:#2d6a4f; text-decoration:none; font-weight:bold;">Classes</a> | 
  <a href="quran.html" style="margin:0 8px; color:#2d6a4f; text-decoration:none; font-weight:bold;">Resources</a> | 
  <a href="contact.html" style="margin:0 8px; color:#2d6a4f; text-decoration:none; font-weight:bold;">Contact</a> | 
  <a href="faq.html" style="margin:0 8px; color:#2d6a4f; text-decoration:none; font-weight:bold;">FAQ</a>
</div>

<form onsubmit="sendToWhatsApp(event)">
  <form onsubmit="sendToWhatsApp(event)">
    <label>Full Name</label>
    <input type="text" id="name" required>
    
    <label>Age</label>
    <input type="number" id="age" required>
    
    <label>Phone Number</label>
    <input type="text" id="phone" required>
    
    <label>Country</label>
    <input type="text" id="country" required>
    
    <label>Q1: Why do you want to join?</label>
    <textarea id="q1" required></textarea>
    
    <label>Q2: Do you have Quran experience?</label>
    <textarea id="q2" required></textarea>
    
    <label>Q3: What time can you study?</label>
    <textarea id="q3" required></textarea>
    
    <label>Q4: Anything else?</label>
    <textarea id="q4"></textarea>
    
    <button type="submit">Send Application via WhatsApp</button>
  </form>

  <hr>
  <h3>Admin Login</h3>
  <input type="password" id="adminPass" placeholder="Enter Password">
  <button onclick="checkPass()" style="background:#3498db;">Login</button>
  
  <div id="adminArea">
    <h4>✅ Welcome Admin</h4>
    <p>Applications will come to your WhatsApp: 0984984625</p>
  </div>
</div>

<script>
function sendToWhatsApp(e){
  e.preventDefault();
  let msg = `NEW APPLICATION%0A%0AName: ${document.getElementById('name').value}%0AAge: ${document.getElementById('age').value}%0APhone: ${document.getElementById('phone').value}%0ACountry: ${document.getElementById('country').value}%0A%0AQ1: ${document.getElementById('q1').value}%0AQ2: ${document.getElementById('q2').value}%0AQ3: ${document.getElementById('q3').value}%0AQ4: ${document.getElementById('q4').value}`;
  window.open(`https://wa.me/265984984625?text=${msg}`,'_blank');
}

function checkPass(){
  let pass = document.getElementById('adminPass').value;
  let area = document.getElementById('adminArea');
  
  if(pass == "ASUM2026"){
    area.style.display = 'block'; 
    alert("✅ Login Successful - Welcome Admin");
  } else {
    alert("❌ Wrong Password. Try: ASUM2026");
  }
}
</script>
</body>
</html>
